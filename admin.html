<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FKS Media - İdarəetmə Paneli</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #d97706;
            --accent-hover: #b45309;
        }
        body { background: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        h1 { margin: 0; color: var(--text-main); font-size: 1.5rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 20px; background: #0b1120; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        input[type="file"] { padding: 10px; cursor: pointer; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: auto; padding: 8px 15px; font-size: 0.85rem; }
        .btn-secondary:hover { background: var(--border-color); color: white; }
        .btn-small { background: var(--accent); padding: 6px 12px; font-size: 0.85rem; width: auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: auto; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
        .hidden { display: none; }
        .post-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); }
        .post-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>FKS Media <span style="font-size: 0.9rem; color: var(--accent);">CMS Redaktoru</span></h1>
            <button class="btn-secondary" onclick="logoutToken()">Token Sıfırla</button>
        </header>

        <!-- Token Giriş Ekranı -->
        <div id="tokenSection" class="card hidden">
            <h2>GitHub Doğrulaması</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Paneli idarə etmək üçün GitHub Token daxil edin.</p>
            <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            <button onclick="saveToken()">Giriş Et</button>
        </div>

        <!-- Əsas İdarəetmə Paneli -->
        <div id="adminPanel" class="hidden">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('new')" id="tabNewBtn">➕ Yeni Məqalə</button>
                <button class="tab-btn" onclick="switchTab('list')" id="tabListBtn">📚 Mövcud Məqalələr & Düzənlə</button>
            </div>

            <!-- Yeni / Düzənlə Məqalə Formu -->
            <div id="newTab" class="card">
                <h2 id="formTitle">Yeni Məqalə Əlavə Et</h2>
                <br>
                
                <input type="hidden" id="editFileName" value="">
                <input type="hidden" id="existingImage" value="">

                <label>Məqalə Başlığı (Add title)</label>
                <input type="text" id="title" placeholder="Məsələn: Hürmüz Boğazı'nda Yeni Düğüm...">

                <label>Kateqoriya</label>
                <select id="category">
                    <option value="Orta Doğu">Orta Doğu</option>
                    <option value="Türkiye">Türkiye</option>
                    <option value="Россия">Россия</option>
                    <option value="Güney Kafkasya">Güney Kafkasya</option>
                    <option value="ABD">ABD</option>
                    <option value="Avrupa">Avrupa</option>
                    <option value="Diplomasi">Diplomasi</option>
                    <option value="Ekonomi ve Güvenlik">Ekonomi ve Güvenlik</option>
                </select>

                <label>Kapak Görseli (Kompyuterdən Şəkil Seç)</label>
                <input type="file" id="imageFile" accept="image/*">

                <label>Məqalə Məzmunu (Content)</label>
                <textarea id="content" rows="12" placeholder="Məqalənin tam mətni..."></textarea>

                <button id="submitBtn" onclick="publishArticle()">Məqaləni Yayınla (Publish)</button>
                <button id="cancelEditBtn" class="hidden btn-secondary" style="width:100%; margin-top:10px;" onclick="resetForm()">Düzəni İptal Et</button>
                <p id="status"></p>
            </div>

            <!-- Məqalə Siyahısı və Düzənləmə Bölməsi -->
            <div id="listTab" class="card hidden">
                <h2>Mövcud Məqalələr (Köhnələri Dəyişdir)</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Buradan istənilən məqaləni seçib düzənləyə bilərsən:</p>
                <div id="postList" style="margin-top: 15px;">Yüklənir...</div>
            </div>
        </div>
    </div>

    <script>
        const REPO_OWNER = "fazilaliyev555-blip";
        const REPO_NAME = "fksmedia";
        const BRANCH = "main";

        window.onload = function() {
            const token = localStorage.getItem('fks_github_token');
            if (token) {
                document.getElementById('tokenSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                document.getElementById('tokenSection').classList.add('hidden');
            }
        };

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if(!token) return alert('Token daxil edin!');
            localStorage.setItem('fks_github_token', token);
            location.reload();
        }

        function logoutToken() {
            localStorage.removeItem('fks_github_token');
            location.reload();
        }

        function switchTab(tab) {
            if(tab === 'new') {
                document.getElementById('newTab').classList.remove('hidden');
                document.getElementById('listTab').classList.add('hidden');
                document.getElementById('tabNewBtn').classList.add('active');
                document.getElementById('tabListBtn').classList.remove('active');
            } else {
                document.getElementById('newTab').classList.add('hidden');
                document.getElementById('listTab').classList.remove('hidden');
                document.getElementById('tabNewBtn').classList.remove('active');
                document.getElementById('tabListBtn').classList.add('active');
                loadPostsList();
            }
        }

        function resetForm() {
            document.getElementById('editFileName').value = '';
            document.getElementById('existingImage').value = '';
            document.getElementById('title').value = '';
            document.getElementById('imageFile').value = '';
            document.getElementById('content').value = '';
            document.getElementById('formTitle').innerText = "Yeni Məqalə Əlavə Et";
            document.getElementById('submitBtn').innerText = "Məqaləni Yayınla (Publish)";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            switchTab('new');
        }

        async function uploadImage(file, token) {
            const fileName = `images/${Date.now()}-${file.name.replace(/\s+/g, '_')}`;
            const reader = new FileReader();
            
            return new Promise((resolve, reject) => {
                reader.onload = async function(e) {
                    const base64Content = e.target.result.split(',')[1];
                    try {
                        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${fileName}`, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                message: `Şəkil yükləndi: ${file.name}`,
                                content: base64Content,
                                branch: BRANCH
                            })
                        });
                        if(res.ok) {
                            resolve(fileName); // Şəkil yolu
                        } else {
                            reject(new Error("Şəkil yüklənmədi."));
                        }
                    } catch(err) {
                        reject(err);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        async function publishArticle() {
            const token = localStorage.getItem('fks_github_token');
            const editFileName = document.getElementById('editFileName').value;
            const existingImage = document.getElementById('existingImage').value;
            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const imageFile = document.getElementById('imageFile').files[0];
            const content = document.getElementById('content').value.trim();
            const statusEl = document.getElementById('status');

            if(!title || !content) {
                statusEl.style.color = "#ef4444";
                statusEl.innerText = "Başlıq və məzmun sahələri boş ola bilməz!";
                return;
            }

            statusEl.style.color = "#eab308";
            statusEl.innerText = "Şəkil və məlumatlar GitHub-a yüklənir...";

            try {
                let imageUrl = existingImage;
                if (imageFile) {
                    imageUrl = await uploadImage(imageFile, token);
                }

                // Avtomatik olaraq cari tarixi təyin edirik (məsələn: 2026-11-18)
                const now = new Date();
                const dateStr = now.toISOString().split('T')[0];

                const fileName = editFileName ? editFileName : `_posts/${Date.now()}.md`;
                const fileContent = `---\ntitle: "${title}"\ncategory: "${category}"\nimage: "${imageUrl}"\ndate: "${dateStr}"\n---\n\n${content}`;
                const encodedContent = btoa(unescape(encodeURIComponent(fileContent)));

                let sha = null;
                if (editFileName) {
                    const getRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${fileName}`, {
                        headers: { 'Authorization': `token ${token}` }
                    });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        sha = fileData.sha;
                    }
                }

                const bodyData = {
                    message: editFileName ? `Məqalə güncəlləndi: ${title}` : `Yeni məqalə: ${title}`,
                    content: encodedContent,
                    branch: BRANCH
                };
                if (sha) bodyData.sha = sha;

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${fileName}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(bodyData)
                });

                if(response.ok) {
                    statusEl.style.color = "#22c55e";
                    statusEl.innerText = editFileName ? "Məqalə uğurla güncəlləndi!" : "Uğurla yayınlandı!";
                    setTimeout(() => { resetForm(); }, 1500);
                } else {
                    const err = await response.json();
                    throw new Error(err.message);
                }
            } catch (error) {
                statusEl.style.color = "#ef4444";
                statusEl.innerText = "Xəta: " + error.message;
            }
        }

        async function loadPostsList() {
            const token = localStorage.getItem('fks_github_token');
            const listEl = document.getElementById('postList');
            listEl.innerHTML = "Yüklənir...";

            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/_posts`, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if(response.ok) {
                    const files = await response.json();
                    if(files.length === 0) {
                        listEl.innerHTML = "<p style='color:var(--text-muted);'>Hələ heç bir məqalə yoxdur.</p>";
                        return;
                    }
                    listEl.innerHTML = files.map(file => `
                        <div class="post-row">
                            <span style="font-size: 0.95rem;">📄 ${file.name}</span>
                            <button class="btn-small" onclick="editPost('${file.path}')">✏️ Düzənlə</button>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = "<p style='color:#ef4444;'>_posts qovluğu tapılmadı.</p>";
                }
            } catch (err) {
                listEl.innerHTML = "<p style='color:#ef4444;'>Bağlantı xətası.</p>";
            }
        }

        async function editPost(path) {
            const token = localStorage.getItem('fks_github_token');
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (response.ok) {
                    const data = await response.json();
                    const rawContent = decodeURIComponent(escape(atob(data.content)));
                    
                    document.getElementById('editFileName').value = path;
                    
                    const titleMatch = rawContent.match(/title:\s*"([^"]*)"/);
                    if (titleMatch) document.getElementById('title').value = titleMatch[1];

                    const catMatch = rawContent.match(/category:\s*"([^"]*)"/);
                    if (catMatch) document.getElementById('category').value = catMatch[1];

                    const imgMatch = rawContent.match(/image:\s*"([^"]*)"/);
                    if (imgMatch) document.getElementById('existingImage').value = imgMatch[1];

                    const parts = rawContent.split('---');
                    if (parts.length >= 3) {
                        document.getElementById('content').value = parts.slice(2).join('---').trim();
                    }

                    document.getElementById('formTitle').innerText = "Məqaləni Düzənlə: " + path.split('/').pop();
                    document.getElementById('submitBtn').innerText = "Dəyişiklikləri Yadda Saxla (Update)";
                    document.getElementById('cancelEditBtn').classList.remove('hidden');
                    
                    switchTab('new');
                } else {
                    alert('Məqalə oxunmadı.');
                }
            } catch(e) {
                alert('Xəta: ' + e.message);
            }
        }
    </script>
</body>
</html>
